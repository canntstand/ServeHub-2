name: Security checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository, dependencies and configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        id: gitleaks_scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/path --redact --no-banner --exit-code 1

      - name: Set up Python tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML and Ansible validators
        run: python -m pip install --disable-pip-version-check yamllint ansible-lint

      - name: Validate YAML syntax
        id: yaml_validation
        continue-on-error: true
        run: |
          yamllint -d relaxed \
            .github/workflows/security.yml \
            docker-compose.ansible.yaml docker-compose.local.yaml docker-compose.remote.yaml \
            ansible/deploy.yml ansible/requirements.yml \
            ansible/group_vars/*.yml ansible/tasks/*.yml \
            configs/blackbox/blackbox.yml configs/monitoring/alert_rules.yml \
            configs/monitoring/alert_rules.test.yml

      - name: Check Ansible syntax
        id: ansible_syntax
        continue-on-error: true
        run: |
          cp ansible/vars/secrets.yml.example ansible/vars/secrets.yml
          ansible-galaxy collection install --no-deps \
            "git+https://github.com/ansible-collections/community.library_inventory_filtering.git,1.1.5"
          ansible-galaxy collection install --no-deps \
            "git+https://github.com/ansible-collections/ansible.posix.git,2.2.2" \
            "git+https://github.com/ansible-collections/community.docker.git,5.4.0"
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check


      - name: Validate Docker Compose configuration
        id: compose_validation
        continue-on-error: true
        run: |
          docker compose -f docker-compose.local.yaml config --quiet
          docker compose -f docker-compose.remote.yaml config --quiet

      - name: Validate shell and embedded firewall syntax
        id: shell_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/ansible-entrypoint.sh
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          import yaml

          paths = (
              "ansible/tasks/setup_local.yml",
              "ansible/tasks/setup_remote.yml",
          )
          for filename in paths:
              tasks = yaml.safe_load(Path(filename).read_text(encoding="utf-8"))
              found = 0
              for task in tasks:
                  copy_task = task.get("ansible.builtin.copy", task.get("copy", {}))
                  if not isinstance(copy_task, dict):
                      continue
                  content = copy_task.get("content")
                  if not isinstance(content, str):
                      continue
                  if "SERVEHUB_INPUT" not in content or "SERVEHUB_DOCKER_USER" not in content:
                      continue
                  content = re.sub(
                      r"(?m)^([ \t]*OUT_IFACE=)\{\{[^\n]*\}\}[ \t]*$",
                      r'\1"eth0"',
                      content,
                  )
                  if "{{" in content or "}}" in content:
                      raise SystemExit(f"{filename}: unexpanded Jinja expression in firewall script")
                  result = subprocess.run(
                      ["bash", "-n"],
                      input=content,
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  if result.returncode:
                      raise SystemExit(f"{filename}: bash -n failed:\\n{result.stderr}")
                  found += 1
              if found != 1:
                  raise SystemExit(f"{filename}: expected one firewall script, found {found}")
              print(f"{filename}: firewall script syntax OK")
          PY

      - name: Report Ansible lint findings (non-blocking initially)
        continue-on-error: true
        run: ansible-lint --profile min ansible/deploy.yml

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1

      - name: Block critical repository misconfigurations
        id: trivy_misconfig
        continue-on-error: true
        run: trivy fs --no-progress --scanners misconfig --severity CRITICAL --exit-code 1 .

      - name: Block critical source dependency vulnerabilities
        id: trivy_source_vulns
        continue-on-error: true
        run: trivy fs --no-progress --scanners vuln --severity CRITICAL --exit-code 1 .

      - name: Report non-critical repository findings (non-blocking)
        continue-on-error: true
        run: trivy fs --no-progress --scanners vuln,misconfig --severity HIGH,MEDIUM,LOW --exit-code 0 .

      - name: Build and scan Compose and custom images for critical vulnerabilities
        id: container_image_scan
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          build_failed=0
          docker build --pull -f Dockerfile.amnezia -t servehub-ci/amnezia-client:scan . || build_failed=1
          docker build --pull -f Dockerfile.certbot -t servehub-ci/certbot:scan . || build_failed=1
          docker build --pull -f ansible/container/Dockerfile -t servehub-ci/ansible:scan ansible/container || build_failed=1
          {
            grep -hE '^[[:space:]]+image:[[:space:]]*[^[:space:]]+' \
              docker-compose.local.yaml docker-compose.remote.yaml |
              sed -E 's/^[[:space:]]*image:[[:space:]]*//' || true
            printf '%s\n' 'servehub-ci/amnezia-client:scan' 'servehub-ci/certbot:scan' 'servehub-ci/ansible:scan'
          } | sort -u > /tmp/servehub-images.txt

          mapfile -t images < /tmp/servehub-images.txt
          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No container images were found in the Compose files or Dockerfiles."
            exit 1
          fi

          critical_failed=$build_failed
          for image in "${images[@]}"; do
            echo "::group::Trivy image scan: $image"
            trivy image --no-progress --scanners vuln --severity CRITICAL --exit-code 0 "$image" || true
            if ! trivy image --no-progress --scanners vuln --severity CRITICAL --exit-code 1 "$image"; then
              critical_failed=1
            fi
            trivy image --no-progress --scanners vuln --severity HIGH,MEDIUM,LOW --exit-code 0 "$image" || true
            echo "::endgroup::"
          done
          exit "$critical_failed"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gui-installer/go.mod
          cache-dependency-path: gui-installer/go.sum

      - name: Report Go module vulnerabilities (non-blocking)
        continue-on-error: true
        working-directory: gui-installer
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.15.9

      - name: Install frontend dependencies
        working-directory: gui-installer/frontend
        run: pnpm install --frozen-lockfile

      - name: Report high and lower frontend vulnerabilities (non-blocking)
        continue-on-error: true
        working-directory: gui-installer/frontend
        run: pnpm audit --audit-level=high

      - name: Block critical frontend vulnerabilities
        id: frontend_critical_audit
        continue-on-error: true
        working-directory: gui-installer/frontend
        run: pnpm audit --audit-level=critical

      - name: Enforce blocking security checks
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks_scan.outcome }}
          YAML_OUTCOME: ${{ steps.yaml_validation.outcome }}
          ANSIBLE_OUTCOME: ${{ steps.ansible_syntax.outcome }}
          COMPOSE_OUTCOME: ${{ steps.compose_validation.outcome }}
          SHELL_SYNTAX_OUTCOME: ${{ steps.shell_syntax.outcome }}
          TRIVY_MISCONFIG_OUTCOME: ${{ steps.trivy_misconfig.outcome }}
          TRIVY_SOURCE_VULNS_OUTCOME: ${{ steps.trivy_source_vulns.outcome }}
          IMAGE_SCAN_OUTCOME: ${{ steps.container_image_scan.outcome }}
          FRONTEND_AUDIT_OUTCOME: ${{ steps.frontend_critical_audit.outcome }}
        run: |
          set -u
          failed=0
          check_outcome() {
            name="$1"
            outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name did not pass (outcome: $outcome)"
              failed=1
            fi
          }
          check_outcome "Gitleaks" "$GITLEAKS_OUTCOME"
          check_outcome "YAML validation" "$YAML_OUTCOME"
          check_outcome "Ansible syntax" "$ANSIBLE_OUTCOME"
          check_outcome "Docker Compose validation" "$COMPOSE_OUTCOME"
          check_outcome "Shell and firewall syntax" "$SHELL_SYNTAX_OUTCOME"
          check_outcome "Critical repository misconfiguration scan" "$TRIVY_MISCONFIG_OUTCOME"
          check_outcome "Critical source dependency scan" "$TRIVY_SOURCE_VULNS_OUTCOME"
          check_outcome "Container image scan" "$IMAGE_SCAN_OUTCOME"
          check_outcome "Critical frontend dependency audit" "$FRONTEND_AUDIT_OUTCOME"
          exit "$failed"
