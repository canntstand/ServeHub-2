web:
  address: "10.8.0.1"
  port: 51822

alerting:
  telegram:
    token: "${TELEGRAM_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"

endpoints:
  - name: "Local server health endpoint"
    group: "infrastructure"
    url: "http://10.8.0.2:8080/health-check"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Локальный сервер или его Nginx недоступен по WireGuard."

  - name: "VPS node exporter"
    group: "infrastructure"
    url: "http://10.8.0.1:9100/metrics"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "VPS node-exporter не отвечает по WireGuard."

  - name: "Homepage"
    group: "web"
    url: "https://${SERVER_NAME}/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Homepage на основном домене недоступен."

  - name: "Grafana"
    group: "monitoring"
    url: "https://grafana.${SERVER_NAME}/api/health"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Grafana не отвечает через локальный Nginx."

  - name: "Prometheus"
    group: "monitoring"
    url: "https://prometheus.${SERVER_NAME}/-/ready"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Prometheus не готов принимать запросы."

  - name: "Alertmanager"
    group: "monitoring"
    url: "https://alertmanager.${SERVER_NAME}/-/ready"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: telegram
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "Alertmanager не отвечает через локальный Nginx."

  - name: "Wildcard TLS certificate"
    group: "security"
    url: "https://grafana.${SERVER_NAME}/"
    interval: 1h
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 720h"
    alerts:
      - type: telegram
        description: "Wildcard TLS-сертификат истекает менее чем через 30 дней или недействителен."
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
