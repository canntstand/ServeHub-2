groups:
  - name: blackbox_probe_alerts
    rules:
      - alert: ProbeFailed
        expr: |
          (
            probe_success{job="blackbox-http"} == 0
          )
          or
          (
            last_over_time(probe_success{job="blackbox-tls"}[2h]) == 0
          )
        for: 10m
        keep_firing_for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Проверка доступности не пройдена: {{ $labels.check_name }}"
          description: "Цель {{ $labels.instance }} не проходит HTTP(S)-проверку более 10 минут."

      - alert: CertificateExpiringSoon
        expr: |
          (
            last_over_time(
              probe_ssl_earliest_cert_expiry{job="blackbox-tls"}[2h]
            ) - time() < 2592000
          )
          and on(instance)
          (
            last_over_time(probe_success{job="blackbox-tls"}[2h]) == 1
          )
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "TLS-сертификат скоро истекает"
          description: "На {{ $labels.instance }} до окончания срока TLS-сертификата менее 30 дней."

  - name: container_alerts
    rules:
      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Контейнер {{ $labels.name }} не обновляет метрику cAdvisor"
          description: "Метрика cAdvisor для контейнера {{ $labels.name }} не обновлялась более 5 минут."

  - name: exporter_alerts
    rules:
      - alert: ExporterDown
        expr: up{job=~"node-exporter-.*|cadvisor-.*|nginx-exporter-.*|adguardhome-exporter|blackbox-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Экспортёр {{ $labels.job }} недоступен"
          description: "Цель {{ $labels.instance }} не отвечает более 5 минут."

  - name: critical_target_alerts
    rules:
      - alert: CriticalTargetDown
        expr: up{job=~"prometheus|alertmanager|grafana|loki|wg-easy"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Критичная цель {{ $labels.job }} недоступна"
          description: "Цель {{ $labels.instance }} не отвечает более 5 минут."

  - name: host_alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Высокая нагрузка на CPU"
          description: "Нагрузка на CPU сервера превышает 90% (текущее значение: {{ $value | printf \"%.2f\" }}%)."

      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Мало оперативной памяти"
          description: "Доступно менее 10% оперативной памяти (текущее значение: {{ $value | printf \"%.2f\" }}%)."

  - name: disk_alerts
    rules:
      - alert: LowDiskSpace
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Заканчивается место на диске"
          description: "Диск заполнен более чем на 85% (текущее значение: {{ $value | printf \"%.2f\" }}%)."

  - name: borgmatic_alerts
    rules:
      - alert: BorgmaticBackupFailed
        expr: servehub_borgmatic_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Последний запуск Borgmatic завершился ошибкой"
          description: "Проверь журнал резервного копирования на {{ $labels.instance }}."

      - alert: BorgmaticBackupTooOld
        expr: |
          (time() - servehub_borgmatic_backup_last_success_timestamp_seconds > 108000)
          and on(instance) (servehub_borgmatic_backup_last_success_timestamp_seconds > 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Давно не было успешного бэкапа"
          description: "Последняя успешная копия старше 30 часов на {{ $labels.instance }}."

      - alert: OffsiteBackupFailed
        expr: servehub_offsite_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Не удалось синхронизировать бэкап в S3"
          description: "Последняя синхронизация off-site-копии или проверка размеров объектов завершилась ошибкой на {{ $labels.instance }}."

      - alert: OffsiteBackupTooOld
        expr: |
          (time() - servehub_offsite_backup_last_success_timestamp_seconds > 108000)
          and on(instance) (servehub_offsite_backup_last_success_timestamp_seconds > 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Давно не было успешной off-site-копии"
          description: "Последняя проверенная копия в S3 старше 30 часов на {{ $labels.instance }}."

      - alert: BackupStackRestoreFailed
        expr: servehub_backup_stack_restore_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Не удалось запустить сервисы после резервного копирования"
          description: "Проверьте журнал borgmatic.service и состояние Compose на {{ $labels.instance }}."

      - alert: BackupPipelineTooOld
        expr: |
          (time() - servehub_backup_pipeline_last_success_timestamp_seconds > 108000)
          and on(instance) (servehub_backup_pipeline_last_success_timestamp_seconds > 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Полный цикл резервного копирования давно не завершался успешно"
          description: "Локальная копия, выгрузка в S3 и восстановление сервисов не завершались успешно вместе более 30 часов на {{ $labels.instance }}."
