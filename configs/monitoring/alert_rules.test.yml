rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  - name: stopped container raises ContainerDown
    interval: 1m
    input_series:
      - series: 'container_last_seen{name="test-container",instance="10.8.0.2:8090"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerDown
        exp_alerts:
          - exp_labels:
              instance: "10.8.0.2:8090"
              name: "test-container"
              severity: critical
            exp_annotations:
              summary: "Контейнер test-container не обновляет метрику cAdvisor"
              description: "Метрика cAdvisor для контейнера test-container не обновлялась более 5 минут."

  - name: active container does not raise ContainerDown
    interval: 1m
    input_series:
      - series: 'container_last_seen{name="running-container",instance="10.8.0.2:8090"}'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ContainerDown
        exp_alerts: []

  - name: exporter and critical target outages are detected
    interval: 1m
    input_series:
      - series: 'up{job="cadvisor-local",instance="10.8.0.2:8090"}'
        values: '0+0x10'
      - series: 'up{job="prometheus",instance="10.8.0.1:9090"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              instance: "10.8.0.2:8090"
              job: "cadvisor-local"
              severity: critical
            exp_annotations:
              summary: "Экспортёр cadvisor-local недоступен"
              description: "Цель 10.8.0.2:8090 не отвечает более 5 минут."
      - eval_time: 10m
        alertname: CriticalTargetDown
        exp_alerts:
          - exp_labels:
              instance: "10.8.0.1:9090"
              job: "prometheus"
              severity: critical
            exp_annotations:
              summary: "Критичная цель prometheus недоступна"
              description: "Цель 10.8.0.1:9090 не отвечает более 5 минут."

  - name: Blackbox probe failure raises ProbeFailed
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http",instance="http://10.8.0.2:8080/health-check",check_name="Local server health endpoint"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ProbeFailed
        exp_alerts:
          - exp_labels:
              check_name: "Local server health endpoint"
              instance: "http://10.8.0.2:8080/health-check"
              job: "blackbox-http"
              severity: critical
            exp_annotations:
              summary: "Проверка доступности не пройдена: Local server health endpoint"
              description: "Цель http://10.8.0.2:8080/health-check не проходит HTTP(S)-проверку более 10 минут."

  - name: Blackbox certificate expiration raises warning
    interval: 1h
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-tls",instance="https://grafana.example.com/",check_name="Wildcard TLS certificate"}'
        values: '2000000+0x5'
      - series: 'probe_success{job="blackbox-tls",instance="https://grafana.example.com/",check_name="Wildcard TLS certificate"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 5h
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              check_name: "Wildcard TLS certificate"
              instance: "https://grafana.example.com/"
              job: "blackbox-tls"
              severity: warning
            exp_annotations:
              summary: "TLS-сертификат скоро истекает"
              description: "На https://grafana.example.com/ до окончания срока TLS-сертификата менее 30 дней."

  - name: failed S3 synchronization raises OffsiteBackupFailed
    interval: 1m
    input_series:
      - series: 'servehub_offsite_backup_last_run_success{instance="10.8.0.2:9100"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: OffsiteBackupFailed
        exp_alerts:
          - exp_labels:
              instance: "10.8.0.2:9100"
              severity: critical
            exp_annotations:
              summary: "Не удалось синхронизировать бэкап в S3"
              description: "Последняя синхронизация off-site-копии или проверка размеров объектов завершилась ошибкой на 10.8.0.2:9100."

  - name: failed Compose service restoration raises BackupStackRestoreFailed
    interval: 1m
    input_series:
      - series: 'servehub_backup_stack_restore_success{instance="10.8.0.1:9100"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: BackupStackRestoreFailed
        exp_alerts:
          - exp_labels:
              instance: "10.8.0.1:9100"
              severity: critical
            exp_annotations:
              summary: "Не удалось запустить сервисы после резервного копирования"
              description: "Проверьте журнал borgmatic.service и состояние Compose на 10.8.0.1:9100."
