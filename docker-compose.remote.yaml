x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    container_name: wg-easy
    logging: *default-logging
    environment:
      - LANG=en
      - PORT=51821
      - TRUSTED_PROXIES=10.8.0.2
      - DISABLE_IPV6=true
      - EXPERIMENTAL_AWG=true
      - OVERRIDE_AUTO_AWG=awg
      - INSECURE=true
      - INIT_ENABLED=true
      - INIT_USERNAME=${ADMIN_USER}
      - INIT_PASSWORD=${ADMIN_PASSWORD}
      - INIT_HOST=${VPS_PUBLIC_IP}
      - INIT_PORT=51820
      - INIT_DNS=10.8.0.1
      - INIT_IPV4_CIDR=10.8.0.0/24
      - INIT_IPV6_CIDR=fdcc:ad94:bacf:61a4::cafe:0/112
      - INIT_ALLOWED_IPS=10.8.0.0/24
    volumes:
      - ./apps-data/wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    network_mode: "host"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "awg", "show", "wg0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: blackbox-exporter
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    network_mode: "host"
    volumes:
      - ./configs/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
      - "--web.listen-address=127.0.0.1:9115"
    depends_on:
      wg-easy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M


  adguardhome:
    image: adguard/adguardhome:v0.107.79
    container_name: adguardhome
    logging: *default-logging
    restart: unless-stopped
    network_mode: "host"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps-data/adguard/work:/opt/adguardhome/work
      - ./configs/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      wg-easy:
        condition: service_healthy

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1
    container_name: adguard-exporter
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging: *default-logging
    ports:
      - "10.8.0.1:9618:9618"
    environment:
      - ADGUARD_SERVERS=http://10.8.0.1:8082
      - ADGUARD_USERNAMES=${ADMIN_USER}
      - ADGUARD_PASSWORDS=${ADMIN_PASSWORD}
      - INTERVAL=2m
    depends_on:
      adguardhome:
        condition: service_started
      wg-easy:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    network_mode: "host"
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
      - ./apps-data/node-exporter/textfile:/textfile_collector:ro
    command:
      - "--web.listen-address=10.8.0.1:9100"
      - "--collector.textfile.directory=/textfile_collector"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/rootfs/(sys|proc|dev|host|etc|var/lib/docker)($$|/)"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      wg-easy:
        condition: service_healthy

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: cadvisor
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    network_mode: "host"
    command:
      - "--allow_dynamic_housekeeping=false"
      - "--housekeeping_interval=2m"
      - "--max_housekeeping_interval=2m"
      - "--disable_metrics=referenced_memory"
      - "--raw_cgroup_prefix_whitelist=/system.slice,/user.slice"
      - "--listen_ip=10.8.0.1"
      - "--port=8090"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev:/dev:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/fs/cgroup:/cgroup:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://10.8.0.1:8090/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      wg-easy:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "10.8.0.1:3100:3100"
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./apps-data/loki:/loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    logging: *default-logging
    depends_on:
      wg-easy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "10.8.0.1:9093:9093"
    volumes:
      - ./configs/monitoring:/etc/alertmanager:ro
      - ./apps-data/alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.${SERVER_NAME}/"
      - "--web.route-prefix=/"
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      wg-easy:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    network_mode: "host"
    volumes:
      - ./configs/monitoring/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./apps-data/prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=10.8.0.1:9090"
      - "--web.external-url=https://prometheus.${SERVER_NAME}/"
      - "--web.route-prefix=/"
    depends_on:
      alertmanager:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      wg-easy:
        condition: service_healthy
      blackbox-exporter:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana:13.2.4-slim
    container_name: grafana
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "10.8.0.1:3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${SERVER_NAME}/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./apps-data/grafana/data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=16m
      - /var/lib/haproxy:rw,noexec,nosuid,size=16m
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    deploy:
      resources:
        limits:
          memory: 128M

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./configs/alloy/remote.alloy:/etc/alloy/config.alloy:ro
      - ./apps-data/alloy:/var/lib/alloy/data
    logging: *default-logging
    networks:
      - default
      - docker_api
    depends_on:
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G

  hermes:
    image: nousresearch/hermes-agent:v0.22.5
    container_name: hermes
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "10.8.0.1:9119:9119"
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PUBLIC_URL=https://hermes.${SERVER_NAME}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${ADMIN_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${ADMIN_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - HERMES_API_BASE_URL=${HERMES_API_BASE_URL}
      - HERMES_MODEL=${HERMES_MODEL}
    command: ["gateway", "run"]
    volumes:
      - ./apps-data/hermes:/opt/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      wg-easy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  docker_api:
    internal: true
