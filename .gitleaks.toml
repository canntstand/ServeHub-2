title = "ServeHub-2 Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Ignore test credentials in security unit-tests"
condition = "AND"
paths = [
  '''gui-installer/secrets_security_test\.go''',
]
regexTarget = "match"
regexes = [
  '''123456789:[A-Z]{26}abcdefghi''',
  '''server\.example\.org''',
  '''admin@example\.com''',
  '''your_vps_username''',
  '''hermes_dashboard_basic_auth_secret''',
  '''map\[string\]string\{"secret":''',
]
