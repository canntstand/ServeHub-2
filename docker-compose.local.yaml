x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.30.6
    container_name: nginx
    logging: *default-logging
    ports:
      - "10.8.0.2:80:80"
      - "127.0.0.1:80:80"
      - "10.8.0.2:443:443"
      - "127.0.0.1:443:443"
      - "10.8.0.2:8080:8080"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      - SERVER_NAME=${SERVER_NAME}
    volumes:
      - ./configs/nginx/templates/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/certs:/etc/letsencrypt:ro
    depends_on:
      navidrome:
        condition: service_started
      audiobookshelf:
        condition: service_started
      nextcloud:
        condition: service_healthy
      vaultwarden:
        condition: service_started
      habitica-client:
        condition: service_started
      amnezia-client:
        condition: service_healthy
      homebox:
        condition: service_started
      gitea:
        condition: service_started
      homepage:
        condition: service_started
      actual-budget:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      default: {}
      reverse_proxy:
        ipv4_address: 10.254.240.2
  certbot:
    build:
      context: .
      dockerfile: Dockerfile.certbot
    container_name: certbot
    logging: *default-logging
    profiles: ["maintenance"]
    restart: "no"
    volumes:
      - ./certbot/certs:/etc/letsencrypt
      - ./certbot/certs-data:/var/lib/letsencrypt
      - ./certbot/certbot-dns-webnames:/opt/certbot-dns-webnames
    environment:
      - SERVER_NAME=${SERVER_NAME}
    command: >
      certonly
      --manual
      --manual-auth-hook /opt/certbot-dns-webnames/authenticator.sh
      --manual-cleanup-hook /opt/certbot-dns-webnames/cleanup.sh
      --preferred-challenges dns-01
      --agree-tos
      --no-eff-email
      --non-interactive
      --force-renewal
      -d "${SERVER_NAME}"
      -d "*.${SERVER_NAME}"
      --email "${EMAIL}"
    deploy:
      resources:
        limits:
          memory: 1G

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "3000"
    environment:
      - PORT=3000
      - TZ=Europe/Moscow
      - HOMEPAGE_ALLOWED_HOSTS=${SERVER_NAME},localhost,127.0.0.1,homepage
      - HOMEPAGE_VAR_SERVER_NAME=${SERVER_NAME}
    volumes:
      - ./configs/homepage/config:/app/config:ro
      - ./configs/homepage/public/images:/app/public/images:ro
    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - homepage-proxy
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: nginx-exporter
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging: *default-logging
    ports:
      - "10.8.0.2:9113:9113"
    command: --nginx.scrape-uri=http://nginx:8080/stub_status
    depends_on:
      nginx:
        condition: service_healthy
      amnezia-client:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    logging: *default-logging
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    network_mode: "host"
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
      - ./apps-data/node-exporter/textfile:/textfile_collector:ro
    command:
      - "--web.listen-address=10.8.0.2:9100"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/rootfs/(sys|proc|dev|host|etc|var/lib/docker)($$|/)"
      - "--collector.textfile.directory=/textfile_collector"
    depends_on:
      amnezia-client:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: cadvisor
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "10.8.0.2:8090:8080"
    command:
      - "--allow_dynamic_housekeeping=false"
      - "--housekeeping_interval=2m"
      - "--max_housekeeping_interval=2m"
      - "--disable_metrics=referenced_memory"
      - "--raw_cgroup_prefix_whitelist=/system.slice,/user.slice"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev:/dev:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/fs/cgroup:/cgroup:ro
    depends_on:
      amnezia-client:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    container_name: docker-socket-proxy
    restart: unless-stopped
    logging: *default-logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=16m
      - /var/lib/haproxy:rw,noexec,nosuid,size=16m
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    networks:
      - docker_api
    deploy:
      resources:
        limits:
          memory: 128M

  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    network_mode: "host"
    command: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./configs/alloy/local.alloy:/etc/alloy/config.alloy:ro
      - ./apps-data/alloy:/var/lib/alloy/data
    logging: *default-logging
    depends_on:
      amnezia-client:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  amnezia-client:
    build:
      context: .
      dockerfile: Dockerfile.amnezia
    container_name: amnezia-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps-data/amnezia:/config:ro
    network_mode: "host"
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(awg show interfaces)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  navidrome:
    container_name: navidrome
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "4533"
    environment:
      ND_SCANINTERVAL: "2m"
      ND_LOGLEVEL: "info"
      ND_BASEURL: "https://navidrome.${SERVER_NAME}"
    volumes:
      - ./apps-data/navidrome/data:/data
      - /home/${LOCAL_USER}/PersonalData/Music:/music:ro
    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - navidrome-proxy
  audiobookshelf:
    container_name: audiobookshelf
    image: advplyr/audiobookshelf:2.37.2
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - AUDIOBOOKSHELF_PORT=80
    volumes:
      - ./apps-data/audiobookshelf/config:/config
      - ./apps-data/audiobookshelf/metadata:/metadata
      - /home/${LOCAL_USER}/PersonalData/Audiobooks:/audiobooks
      - /home/${LOCAL_USER}/PersonalData/Podcasts:/podcasts
      - /home/${LOCAL_USER}/PersonalData/Books:/books
    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - audiobookshelf-proxy
  nextcloud-db:
    image: postgres:18.6
    container_name: nextcloud-db
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./apps-data/postgres/nextcloud:/var/lib/postgresql
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  nextcloud-redis:
    image: redis:8.8.3
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASS}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  nextcloud:
    image: nextcloud:34-apache
    container_name: nextcloud
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_started
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - OVERWRITEHOST=nextcloud.${SERVER_NAME}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${SERVER_NAME}
      - REDIS_HOST=nextcloud-redis
      - REDIS_PORT=6379
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASS}
      - HTACCESS_OVERRIDE_CURRENT=1
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${SERVER_NAME}
      - TRUSTED_PROXIES=10.254.240.2
      - NC_maintenance_window_start=2
      - NC_default_phone_region=RU
      - NC_filelocking.enabled=true
      - 'NC_memcache.local=\OC\Memcache\APCu'
      - 'NC_memcache.locking=\OC\Memcache\Redis'
    volumes:
      - ./apps-data/nextcloud/html:/var/www/html
      - /home/${LOCAL_USER}/PersonalData/NextcloudData:/var/www/html/data
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/config/config.php && php occ status"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - nextcloud-proxy
  nextcloud-cron:
    image: nextcloud:34-apache
    container_name: nextcloud-cron
    restart: unless-stopped
    volumes:
      - ./apps-data/nextcloud/html:/var/www/html
      - /home/${LOCAL_USER}/PersonalData/NextcloudData:/var/www/html/data
    entrypoint: /cron.sh
    logging: *default-logging
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  vaultwarden-db:
    image: postgres:18.6
    container_name: vaultwarden-db
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./apps-data/postgres/vaultwarden:/var/lib/postgresql
    environment:
      - POSTGRES_DB=vaultwarden
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vaultwarden-db:5432/vaultwarden
      - DOMAIN=https://vaultwarden.${SERVER_NAME}
      - SIGNUPS_ALLOWED=true
      - ENABLE_WEBSOCKET=true
      - IP_HEADER=X-Real-IP
      - IP_HEADER_TRUSTED_PROXIES=10.254.240.2
      - ADMIN_TOKEN=${SECRET_VAULTWARDEN_PASSWORD}
    volumes:
      - ./apps-data/vaultwarden/data:/data
    deploy:
      resources:
        limits:
          memory: 1G

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - vaultwarden-proxy
  gitea:
    image: gitea/gitea:28.2.0
    container_name: gitea
    logging: *default-logging
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://gitea.${SERVER_NAME}/
      - GITEA__security__REVERSE_PROXY_LIMIT=1
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=10.254.240.2
      - GITEA__server__DISABLE_SSH=true
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - ./apps-data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    restart: unless-stopped

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - gitea-proxy
  habitica:
    image: docker.io/awinterstein/habitica-server:5.51.0
    container_name: habitica-server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      habitica-db:
        condition: service_healthy
    environment:
      - NODE_DB_URI=mongodb://habitica-db/habitica
      - BASE_URL=https://habitica.${SERVER_NAME}
      - INVITE_ONLY=false
    networks:
      default:
        aliases:
          - server
          - habitica-server
      reverse_proxy:
        aliases:
          - habitica-proxy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1G

  habitica-client:
    image: docker.io/awinterstein/habitica-client:5.51.0
    container_name: habitica-client
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      habitica:
        condition: service_started
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 512M

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - habitica-client-proxy
  habitica-db:
    image: docker.io/mongo:7.0.45
    container_name: habitica-db
    restart: unless-stopped
    hostname: habitica-db
    command: ["--replSet", "rs", "--bind_ip_all", "--port", "27017"]
    logging: *default-logging
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 30s
      start_period: 5s
      start_interval: 1s
      retries: 30
    volumes:
      - ./apps-data/habitica-db:/data/db:rw
    deploy:
      resources:
        limits:
          memory: 1G

  homebox-db:
    image: postgres:18.6
    container_name: homebox-db
    logging: *default-logging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=homebox
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./apps-data/postgres/homebox:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.0
    container_name: homebox
    logging: *default-logging
    restart: unless-stopped
    expose:
      - "7745"
    environment:
      - HBOX_MODE=production
      - HBOX_WEB_PORT=7745
      - HBOX_OPTIONS_ALLOW_REGISTRATION=true
      - HBOX_DATABASE_DRIVER=postgres
      - HBOX_DATABASE_HOST=homebox-db
      - HBOX_DATABASE_PORT=5432
      - HBOX_DATABASE_DATABASE=homebox
      - HBOX_DATABASE_USERNAME=${POSTGRES_USER}
      - HBOX_DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - HBOX_DATABASE_SSL_MODE=disable
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_PEPPER}
    volumes:
      - ./apps-data/homebox:/data
    depends_on:
      homebox-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - homebox-proxy

  actual-budget:
    image: actualbudget/actual-server:26.10.0
    container_name: actual-budget
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "5006"
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./apps-data/actual-budget:/data
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

    networks:
      default: {}
      reverse_proxy:
        aliases:
          - actual-budget-proxy

networks:
  docker_api:
    internal: true
  reverse_proxy:
    internal: true
    ipam:
      config:
        - subnet: 10.254.240.0/24
          ip_range: 10.254.240.128/25
