# =========================================================================
# BACKUP STORAGE + BORGMATIC SYSTEMD TIMER
# =========================================================================
- name: "[Backup] Проверка UUID заданного диска"
  ansible.builtin.command:
    argv:
      - blkid
      - -U
      - "{{ backup_disk_uuid }}"
  register: disk_check
  changed_when: false
  failed_when: false
  when: backup_disk_uuid | default('') | string | length > 0

- name: "[Backup] Ошибка, если настроенный диск не найден"
  ansible.builtin.fail:
    msg: "backup_disk_uuid задан, но диск с этим UUID не найден. Бэкапы не будут запускаться на корневой файловой системе."
  when:
    - backup_disk_uuid | default('') | string | length > 0
    - disk_check.rc | default(1) != 0

- name: "[Backup] Блок настройки резервного копирования"
  when:
    - backup_disk_uuid | default('') | string | length > 0
    - disk_check.rc | default(1) == 0
  block:
    - name: "[Backup] Монтирование диска и запись в fstab"
      ansible.posix.mount:
        path: /mnt/backup_storage
        src: "UUID={{ backup_disk_uuid }}"
        fstype: auto
        opts: defaults,nofail
        state: mounted

    - name: "[Backup] Ограничение доступа к каталогу резервного диска"
      ansible.builtin.file:
        path: /mnt/backup_storage
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "[Backup] Создание каталога конфигурации Borgmatic"
      ansible.builtin.file:
        path: /etc/borgmatic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "[Backup] Проверка наличия парольной фразы шифрования"
      ansible.builtin.assert:
        that:
          - (borgmatic_encryption_passphrase | default(borg_passphrase | default('')) | string | length) >= 20
        fail_msg: >-
          Для включённого Borgmatic задайте borgmatic_encryption_passphrase длиной
          не менее 20 символов в vars/secrets.yml. Не запускайте зашифрованные
          бэкапы с пустой парольной фразой.
      no_log: true

    - name: "[Backup] Генерация конфигурации Borgmatic"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/borgmatic_config.yaml.j2"
        dest: /etc/borgmatic/config.yaml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "[Backup] Валидация конфигурации Borgmatic"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/borgmatic
          - --config
          - /etc/borgmatic/config.yaml
          - config
          - validate
      changed_when: false
      no_log: true

    - name: "[Backup] Проверка наличия существующего репозитория Borg"
      ansible.builtin.stat:
        path: /mnt/backup_storage/server_backup.borg/config
      register: borg_repo_stat

    - name: "[Backup] Инициализация репозитория только при отсутствии config"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/borgmatic
          - --config
          - /etc/borgmatic/config.yaml
          - repo-create
          - --encryption
          - repokey-blake2
          - --make-parent-dirs
      when: not borg_repo_stat.stat.exists
      no_log: true

    - name: "[Backup] Создание приватного кэша Borg"
      ansible.builtin.file:
        path: /root/.cache/borg
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: "[Backup] Установка borgmatic.service"
      ansible.builtin.copy:
        dest: /etc/systemd/system/borgmatic.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description= borgmatic backup
          Documentation=https://torsion.org/borgmatic/
          Wants=network-online.target
          After=network-online.target local-fs.target docker.service
          RequiresMountsFor=/mnt/backup_storage
          ConditionPathIsMountPoint=/mnt/backup_storage

          [Service]
          Type=oneshot
          User=root
          Environment=PATH=/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/local/bin/borgmatic --config /etc/borgmatic/config.yaml --verbosity -1
          Nice=19
          IOSchedulingClass=best-effort
          IOSchedulingPriority=7
          TimeoutStartSec=6h
      register: borgmatic_service_file

    - name: "[Backup] Установка borgmatic.timer"
      ansible.builtin.copy:
        dest: /etc/systemd/system/borgmatic.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run borgmatic backups daily

          [Timer]
          OnCalendar=*-*-* 04:00:00
          RandomizedDelaySec=15m
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: borgmatic_timer_file

    - name: "[Backup] Перечитывание systemd при изменении unit-файлов"
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: borgmatic_service_file.changed or borgmatic_timer_file.changed

    - name: "[Backup] Включение и запуск borgmatic.timer"
      ansible.builtin.systemd_service:
        name: borgmatic.timer
        enabled: true
        state: started

# =========================================================================
# ALERTMANAGER
# =========================================================================
- name: "[Monitoring] Создание каталога данных Alertmanager"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/alertmanager"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"

- name: "[Monitoring] Генерация alertmanager.yml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/alertmanager.yml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/configs/monitoring/alertmanager.yml"
    owner: "{{ deploy_user }}"
    group: "65534"
    mode: "0640"
  register: alertmanager_config
  no_log: true

# =========================================================================
# KERNEL, FORWARDING AND FIREWALL
# =========================================================================
- name: "[Kernel] Проверка/загрузка модуля AmneziaWG"
  ansible.builtin.command:
    cmd: modprobe amneziawg
  changed_when: false

- name: "[Kernel] Настройка sysctl для маршрутизации"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv4.conf.all.src_valid_mark", value: "1" }

- name: "[Firewall] Удаление iptables-persistent, не сохраняем динамические цепочки Docker"
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: false

- name: "[Firewall] Создание скрипта восстановления правил ServeHub"
  ansible.builtin.copy:
    dest: /usr/local/sbin/servehub-firewall-local.sh
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      IPT=/usr/sbin/iptables
      OUT_IFACE={{ ansible_facts['default_ipv4']['interface'] | quote }}

      $IPT -C FORWARD -i awg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -i awg0 -j ACCEPT
      $IPT -C FORWARD -o awg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -o awg0 -j ACCEPT
      $IPT -t nat -C POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE 2>/dev/null || \
        $IPT -t nat -A POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE
  register: local_firewall_script

- name: "[Firewall] Создание systemd-сервиса восстановления правил ServeHub"
  ansible.builtin.copy:
    dest: /etc/systemd/system/servehub-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Restore ServeHub VPN firewall rules
      Wants=network-online.target
      After=network-online.target docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/servehub-firewall-local.sh

      [Install]
      WantedBy=multi-user.target
  register: local_firewall_unit

- name: "[Firewall] Перечитывание systemd при изменении unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: local_firewall_unit.changed

- name: "[Firewall] Применение правил и включение автозагрузки"
  ansible.builtin.systemd_service:
    name: servehub-firewall.service
    enabled: true
    state: "{{ 'restarted' if local_firewall_script.changed or local_firewall_unit.changed else 'started' }}"

# =========================================================================
# START LOCAL COMPOSE STACK
# =========================================================================
- name: "[Docker] Запуск локального стека без безусловного restart Docker"
  community.docker.docker_compose_v2:
    project_src: "/home/{{ deploy_user }}/ServeHub-2"
    files:
      - docker-compose.local.yaml
    state: present
    pull: missing
  register: compose_start

- name: "[Alertmanager] Применение изменённой конфигурации"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml restart alertmanager
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: alertmanager_config.changed

- name: "[Docker Compose] Проверка статуса локальных контейнеров"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml ps
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  register: compose_ps_output
  changed_when: false

- name: "[Status] Текущий статус локальных контейнеров"
  ansible.builtin.debug:
    var: compose_ps_output.stdout_lines

# =========================================================================
# SYSTEMD-RESOLVED DNS FOR awg0
# =========================================================================
- name: "[Network] Включение systemd-resolved"
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started

- name: "[Network] Установка сервиса amnezia-dns"
  ansible.builtin.copy:
    dest: /etc/systemd/system/amnezia-dns.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Configure DNS routing over ServeHub AmneziaWG interface
      Requires=docker.service
      After=docker.service systemd-resolved.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      TimeoutStartSec=120
      ExecStartPre=/bin/bash -ec 'for i in {1..100}; do /usr/sbin/ip link show awg0 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "awg0 did not appear within 100 seconds" >&2; exit 1'
      ExecStart=/usr/bin/resolvectl dns awg0 10.8.0.1
      ExecStartPost=/usr/bin/resolvectl domain awg0 ~.

      [Install]
      WantedBy=multi-user.target
  register: amnezia_dns_service

- name: "[Network] Перечитывание systemd при изменении DNS unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: amnezia_dns_service.changed

- name: "[Network] Активация/перезапуск DNS-сервиса"
  ansible.builtin.systemd_service:
    name: amnezia-dns.service
    enabled: true
    state: "{{ 'restarted' if amnezia_dns_service.changed else 'started' }}"
    daemon_reload: false
