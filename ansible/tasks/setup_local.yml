- name: "[FS] Подготовка каталога для конфигурации AmneziaWG до ручного шага"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/amnezia"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"

- name: "[Pause] Ручная настройка WireGuard и перенос данных на Local"
  ansible.builtin.pause:
    prompt: |
      ======================================================================
      НАСТРОЙКА LOCAL SERVER (РУЧНОЙ ШАГ)
      ======================================================================
      При миграции скопируйте старые apps-data в:
        /home/{{ deploy_user }}/ServeHub-2/apps-data/
      и PersonalData в:
        /home/{{ deploy_user }}/PersonalData/

      Если файл клиента ещё не создан, откройте SSH-туннель к панели wg-easy:
        ssh -L 8000:127.0.0.1:51821 {{ vps_user }}@{{ vps_public_ip }}
      Перед созданием клиента желательно настроить правила обфускации AmneziaWG
      в интерфейсе wg-easy, чтобы параметры попали в экспортируемую конфигурацию.
      Затем откройте http://127.0.0.1:8000, создайте клиента с фиксированным
      IPv4-адресом 10.8.0.2 и сохраните конфигурацию в:
        /home/{{ deploy_user }}/ServeHub-2/apps-data/amnezia/awg0.conf

      На чистом сервере отсутствие старых apps-data допустимо, но awg0.conf
      должен быть создан до продолжения. Нажмите ENTER после подготовки.

- name: "[VPN] Проверка наличия клиентской конфигурации AmneziaWG"
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/amnezia/awg0.conf"
  register: wg_config

- name: "[VPN] Остановка развёртывания, если отсутствует awg0.conf"
  ansible.builtin.assert:
    that:
      - wg_config.stat.exists
      - wg_config.stat.size | default(0) | int > 0
    fail_msg: >-
      Конфигурация awg0.conf отсутствует или пуста. Создайте конфигурацию
      клиента wg-easy с IP 10.8.0.2 и повторите запуск.

- name: "[VPN] Ограничение доступа к клиентской конфигурации AmneziaWG"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/amnezia/awg0.conf"
    state: file
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

- name: "[Certbot] Создание каталогов на Workload"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - certbot/certs
    - certbot/certs-data

- name: "[Certbot] Клонирование Webnames DNS hook scripts"
  ansible.builtin.git:
    repo: https://github.com/regtime-ltd/certbot-dns-webnames.git
    dest: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames"
    version: master
    update: false
  become_user: "{{ deploy_user }}"

- name: "[Certbot] Получение конфигурации Webnames API"
  ansible.builtin.get_url:
    url: "https://www.webnames.ru/scripts/json_domain_zone_manager.pl?action=get_config_certbot&domain={{ server_name | urlencode }}&apikey={{ webnames_apikey | urlencode }}"
    dest: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

- name: "[Certbot] Проверка конфигурации Webnames"
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  register: webnames_config_stat

- name: "[Certbot] Проверка наличия конфигурации Webnames"
  ansible.builtin.assert:
    that:
      - webnames_config_stat.stat.exists
      - webnames_config_stat.stat.size | default(0) | int > 0
    fail_msg: >-
      Конфигурация Webnames отсутствует или пуста.
      Проверьте домен и API-ключ.

- name: "[Certbot] Проверка синтаксиса конфигурации Webnames"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -n
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  changed_when: false

- name: "[Certbot] Проверка наличия API_KEY"
  ansible.builtin.command:
    argv:
      - /bin/grep
      - -Eq
      - '^[[:space:]]*(export[[:space:]]+)?API_KEY='
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  changed_when: false

- name: "[Docker Compose] Проверка конфигурации локального стека до изменений данных"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml config --quiet
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false

- name: "[Certbot] Установка прав на DNS hook-скрипты"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - authenticator.sh
    - cleanup.sh

- name: "[Certbot] Сборка образа на Workload"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml build certbot
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false

- name: "[Certbot] Проверка наличия сертификата"
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certs/live/{{ server_name }}/fullchain.pem"
  register: current_cert_stat

- name: "[Certbot] Проверка срока действия сертификата"
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "2592000"
      - -noout
      - -in
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certs/live/{{ server_name }}/fullchain.pem"
  register: cert_expiry_check
  when: current_cert_stat.stat.exists
  failed_when: false
  changed_when: false

- name: "[Certbot] Первоначальный выпуск wildcard-сертификата"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml run --rm certbot
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: not current_cert_stat.stat.exists
  register: certbot_initial_issue

- name: "[Certbot] Продление сертификата перед истечением"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml run --rm certbot renew --non-interactive
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when:
    - current_cert_stat.stat.exists
    - cert_expiry_check.rc is defined
    - cert_expiry_check.rc != 0
  register: certbot_renewal

- name: "[FS] Создание корня apps-data"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: "[FS] Создание каталогов данных с владельцами UID/GID контейнеров"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "vaultwarden/data", owner: "1000", group: "1000", mode: "0700" }
    - { path: "navidrome/data", owner: "1000", group: "1000", mode: "0700" }
    - { path: "audiobookshelf/config", owner: "1000", group: "1000", mode: "0700" }
    - { path: "audiobookshelf/metadata", owner: "1000", group: "1000", mode: "0700" }
    - { path: "postgres/nextcloud", owner: "999", group: "999", mode: "0700" }
    - { path: "postgres/vaultwarden", owner: "999", group: "999", mode: "0700" }
    - { path: "postgres/homebox", owner: "999", group: "999", mode: "0700" }
    - { path: "homebox", owner: "1000", group: "1000", mode: "0700" }
    - { path: "gitea", owner: "1000", group: "1000", mode: "0700" }
    - { path: "habitica-db", owner: "999", group: "999", mode: "0700" }
    - { path: "actual-budget", owner: "1001", group: "1001", mode: "0700" }
    - { path: "amnezia", owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0700" }

- name: "[FS] Рекурсивная коррекция UID/GID и ограничение прав каталогов данных"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/{{ item.path }}"
    state: directory
    recurse: true
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "vaultwarden/data", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "navidrome/data", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "audiobookshelf/config", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "audiobookshelf/metadata", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "postgres/nextcloud", owner: "999", group: "999", mode: "u=rwX,g=,o=" }
    - { path: "postgres/vaultwarden", owner: "999", group: "999", mode: "u=rwX,g=,o=" }
    - { path: "postgres/homebox", owner: "999", group: "999", mode: "u=rwX,g=,o=" }
    - { path: "homebox", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "gitea", owner: "1000", group: "1000", mode: "u=rwX,g=,o=" }
    - { path: "habitica-db", owner: "999", group: "999", mode: "u=rwX,g=,o=" }
    - { path: "actual-budget", owner: "1001", group: "1001", mode: "u=rwX,g=,o=" }
    - { path: "amnezia", owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "u=rwX,g=,o=" }

- name: "[FS] Создание каталога метрик Borgmatic для textfile collector"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/node-exporter/textfile"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[FS] Настройка Nextcloud HTML (UID 33)"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/nextcloud/html"
    state: directory
    recurse: true
    owner: "33"
    group: "{{ deploy_user }}"
    mode: "u=rwX,g=rwX,o="

- name: "[FS] Создание родительского каталога PersonalData с проходом для контейнера Nextcloud"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/PersonalData"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0711"

- name: "[FS] Создание каталогов медиафайлов"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/PersonalData/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - Music
    - Audiobooks
    - Podcasts
    - Books

- name: "[FS] Настройка NextcloudData (UID 33)"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/PersonalData/NextcloudData"
    state: directory
    recurse: true
    owner: "33"
    group: "{{ deploy_user }}"
    mode: "u=rwX,g=rwX,o="

- name: "[Kernel] Проверка/загрузка модуля AmneziaWG"
  ansible.builtin.command:
    cmd: modprobe amneziawg
  changed_when: false

- name: "[Kernel] Настройка sysctl для маршрутизации"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv4.conf.all.src_valid_mark", value: "1" }

- name: "[Firewall] Удаление iptables-persistent, не сохраняем динамические цепочки Docker"
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: false

- name: "[Firewall] Политика default-deny для Workload и Docker-публикаций"
  ansible.builtin.copy:
    dest: /usr/local/sbin/servehub-firewall-local.sh
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      IPT=/usr/sbin/iptables
      IP6T=/usr/sbin/ip6tables
      OUT_IFACE={{ ansible_facts['default_ipv4']['interface'] | quote }}

      $IPT -C FORWARD -i awg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -i awg0 -j ACCEPT
      $IPT -C FORWARD -o awg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -o awg0 -j ACCEPT
      $IPT -t nat -C POSTROUTING -s 172.16.0.0/12 -d 10.8.0.0/24 -o awg0 -j MASQUERADE 2>/dev/null || \
        $IPT -t nat -A POSTROUTING -s 172.16.0.0/12 -d 10.8.0.0/24 -o awg0 -j MASQUERADE
      $IPT -t nat -C POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE 2>/dev/null || \
        $IPT -t nat -A POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE

      $IPT -N SERVEHUB_INPUT 2>/dev/null || true
      $IPT -F SERVEHUB_INPUT
      $IPT -A SERVEHUB_INPUT -i lo -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i awg0 -s 10.8.0.1 -p tcp --dport 9100 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i awg0 -s 10.8.0.0/24 -p tcp --dport 9100 -j DROP
      $IPT -A SERVEHUB_INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
      $IPT -A SERVEHUB_INPUT -p icmp -j ACCEPT
      if $IPT -nL f2b-sshd >/dev/null 2>&1; then
        $IPT -A SERVEHUB_INPUT -p tcp --dport 22 -j f2b-sshd
      fi
      $IPT -A SERVEHUB_INPUT -p tcp --dport 22 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -p udp --sport 67 --dport 68 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -j DROP
      while $IPT -C INPUT -j SERVEHUB_INPUT 2>/dev/null; do
        $IPT -D INPUT -j SERVEHUB_INPUT
      done
      $IPT -I INPUT 1 -j SERVEHUB_INPUT

      if command -v "$IP6T" >/dev/null 2>&1; then
        $IP6T -N SERVEHUB_INPUT_V6 2>/dev/null || true
        $IP6T -F SERVEHUB_INPUT_V6
        $IP6T -A SERVEHUB_INPUT_V6 -i lo -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -p ipv6-icmp -j ACCEPT
        if $IP6T -nL f2b-sshd >/dev/null 2>&1; then
          $IP6T -A SERVEHUB_INPUT_V6 -p tcp --dport 22 -j f2b-sshd
        fi
        $IP6T -A SERVEHUB_INPUT_V6 -p tcp --dport 22 -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -p udp --sport 547 --dport 546 -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -j DROP
        while $IP6T -C INPUT -j SERVEHUB_INPUT_V6 2>/dev/null; do
          $IP6T -D INPUT -j SERVEHUB_INPUT_V6
        done
        $IP6T -I INPUT 1 -j SERVEHUB_INPUT_V6
      fi

      for attempt in {1..30}; do
        $IPT -nL DOCKER-USER >/dev/null 2>&1 && break
        sleep 1
      done
      if ! $IPT -nL DOCKER-USER >/dev/null 2>&1; then
        echo "Docker's DOCKER-USER chain is missing; refusing to apply an incomplete firewall." >&2
        exit 1
      fi
      $IPT -N SERVEHUB_DOCKER_USER 2>/dev/null || true
      $IPT -F SERVEHUB_DOCKER_USER
      for port in 8080 8090 9113; do
        $IPT -A SERVEHUB_DOCKER_USER -i awg0 -s 10.8.0.1 -p tcp -m conntrack --ctorigdst 10.8.0.2 --ctorigdstport "$port" -j RETURN
        $IPT -A SERVEHUB_DOCKER_USER -i awg0 -p tcp -m conntrack --ctorigdst 10.8.0.2 --ctorigdstport "$port" -j DROP
      done
      $IPT -A SERVEHUB_DOCKER_USER -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
      for port in 80 443; do
        $IPT -A SERVEHUB_DOCKER_USER -i awg0 -s 10.8.0.0/24 -p tcp -m conntrack --ctorigdst 10.8.0.2 --ctorigdstport "$port" -j RETURN
      done
      $IPT -A SERVEHUB_DOCKER_USER -i "$OUT_IFACE" -m conntrack --ctstate NEW -j DROP
      $IPT -A SERVEHUB_DOCKER_USER -j RETURN
      while $IPT -C DOCKER-USER -j SERVEHUB_DOCKER_USER 2>/dev/null; do
        $IPT -D DOCKER-USER -j SERVEHUB_DOCKER_USER
      done
      $IPT -I DOCKER-USER 1 -j SERVEHUB_DOCKER_USER

      if command -v "$IP6T" >/dev/null 2>&1 && $IP6T -nL DOCKER-USER >/dev/null 2>&1; then
        $IP6T -N SERVEHUB_DOCKER_USER_V6 2>/dev/null || true
        $IP6T -F SERVEHUB_DOCKER_USER_V6
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -i "$OUT_IFACE" -m conntrack --ctstate NEW -j DROP
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -j RETURN
        while $IP6T -C DOCKER-USER -j SERVEHUB_DOCKER_USER_V6 2>/dev/null; do
          $IP6T -D DOCKER-USER -j SERVEHUB_DOCKER_USER_V6
        done
        $IP6T -I DOCKER-USER 1 -j SERVEHUB_DOCKER_USER_V6
      fi
  register: local_firewall_script

- name: "[Firewall] Создание systemd-сервиса восстановления правил ServeHub"
  ansible.builtin.copy:
    dest: /etc/systemd/system/servehub-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Restore ServeHub VPN firewall rules
      Wants=network-online.target
      After=network-online.target docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/servehub-firewall-local.sh

      [Install]
      WantedBy=multi-user.target
  register: local_firewall_unit

- name: "[Firewall] Перечитывание systemd при изменении unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: local_firewall_unit.changed

- name: "[Firewall] Применение правил и включение автозагрузки"
  ansible.builtin.systemd_service:
    name: servehub-firewall.service
    enabled: true
    state: "{{ 'restarted' if local_firewall_script.changed or local_firewall_unit.changed else 'started' }}"

- name: "[Docker] Запуск локального стека без безусловного restart Docker"
  community.docker.docker_compose_v2:
    project_src: "/home/{{ deploy_user }}/ServeHub-2"
    files:
      - docker-compose.local.yaml
    state: present
    pull: missing
    remove_orphans: true
  register: compose_start

- name: "[Nginx] Проверка конфигурации и перечитывание сертификата на Workload"
  ansible.builtin.command:
    cmd: >-
      docker compose -f docker-compose.local.yaml exec -T nginx
      sh -ec 'nginx -t && nginx -s reload'
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false

- name: "[Docker Compose] Проверка статуса локальных контейнеров"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.local.yaml ps
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  register: compose_ps_output
  changed_when: false

- name: "[Status] Текущий статус локальных контейнеров"
  ansible.builtin.debug:
    var: compose_ps_output.stdout_lines

- name: "[Certbot] Установка certbot-renew.service на Workload"
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Renew ServeHub TLS certificates using Webnames DNS-01
      Wants=docker.service
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=root
      WorkingDirectory=/home/{{ deploy_user }}/ServeHub-2
      Environment=PATH=/usr/local/bin:/usr/bin:/bin
      ExecStart=/bin/bash /home/{{ deploy_user }}/ServeHub-2/scripts/renew_certs.sh
      TimeoutStartSec=30min
  register: certbot_service_file

- name: "[Certbot] Установка certbot-renew.timer на Workload"
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Twice-daily ServeHub TLS renewal check

      [Timer]
      OnCalendar=*-*-* 03,15:00:00
      RandomizedDelaySec=900
      Persistent=true

      [Install]
      WantedBy=timers.target
  register: certbot_timer_file

- name: "[Certbot] Обновление конфигурации systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: certbot_service_file.changed or certbot_timer_file.changed

- name: "[Certbot] Включение таймера продления"
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    enabled: true
    state: started

- name: "[Network] Включение systemd-resolved"
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started

- name: "[Network] Установка сервиса amnezia-dns"
  ansible.builtin.copy:
    dest: /etc/systemd/system/amnezia-dns.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Configure DNS routing over ServeHub AmneziaWG interface
      Requires=docker.service
      After=docker.service systemd-resolved.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      TimeoutStartSec=120
      ExecStartPre=/bin/bash -ec 'for i in {1..100}; do /usr/sbin/ip link show awg0 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "awg0 did not appear within 100 seconds" >&2; exit 1'
      ExecStart=/usr/bin/resolvectl dns awg0 10.8.0.1
      ExecStartPost=/usr/bin/resolvectl domain awg0 ~.

      [Install]
      WantedBy=multi-user.target
  register: amnezia_dns_service

- name: "[Network] Перечитывание systemd при изменении DNS unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: amnezia_dns_service.changed

- name: "[Network] Активация/перезапуск DNS-сервиса"
  ansible.builtin.systemd_service:
    name: amnezia-dns.service
    enabled: true
    state: "{{ 'restarted' if amnezia_dns_service.changed else 'started' }}"
    daemon_reload: false

- name: "[Backup] Проверка UUID отдельного диска"
  ansible.builtin.command:
    argv:
      - blkid
      - -U
      - "{{ backup_disk_uuid }}"
  register: disk_check
  changed_when: false
  failed_when: false
  when: backup_disk_uuid | default('') | string | trim | length > 0

- name: "[Backup] Ошибка, если настроенный диск не найден"
  ansible.builtin.fail:
    msg: "backup_disk_uuid задан, но диск с этим UUID не найден. Исправьте UUID или оставьте значение пустым, чтобы использовать /var/lib/servehub-backup."
  when:
    - backup_disk_uuid | default('') | string | trim | length > 0
    - disk_check.rc | default(1) != 0

- name: "[Backup] Монтирование отдельного диска для локального репозитория"
  when:
    - backup_disk_uuid | default('') | string | trim | length > 0
    - disk_check.rc | default(1) == 0
  block:
    - name: "[Backup] Монтирование диска и запись в fstab"
      ansible.posix.mount:
        path: /mnt/backup_storage
        src: "UUID={{ backup_disk_uuid }}"
        fstype: auto
        opts: defaults,nofail
        state: mounted

    - name: "[Backup] Ограничение доступа к каталогу резервного диска"
      ansible.builtin.file:
        path: /mnt/backup_storage
        state: directory
        owner: root
        group: root
        mode: "0700"

- name: "[Backup] Настройка Borgmatic и off-site S3 для Workload"
  ansible.builtin.include_tasks: setup_backup.yml
  vars:
    backup_role: workload
    backup_repository_path: "{{ '/mnt/backup_storage/server_backup.borg' if (backup_disk_uuid | default('') | string | trim | length > 0) else '/var/lib/servehub-backup/workload-repo' }}"
    backup_metrics_dir: "/home/{{ deploy_user }}/ServeHub-2/apps-data/node-exporter/textfile"
    backup_compose_file: docker-compose.local.yaml
    backup_keep_services: "amnezia-client node-exporter cadvisor"
    backup_schedule_time: "04:00:00"
