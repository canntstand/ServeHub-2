- name: "[User] Создание пользователя {{ deploy_user }} и добавление в sudo"
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups:
      - sudo
    append: true
    create_home: true
    state: present

- name: "[Sudoers] Настройка беспарольного sudo для {{ deploy_user }}"
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/90-ansible-users
    regexp: '^{{ deploy_user | regex_escape }}\s'
    line: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL"
    create: true
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: "[SSH] Установка публичного ключа до отключения password auth"
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    key: "{{ ssh_public_key }}"
    manage_dir: true

- name: "[Privilege] Переключение на deploy_user для дальнейшего развёртывания"
  ansible.builtin.set_fact:
    ansible_user: "{{ deploy_user }}"
    ansible_password: ""
    ansible_become: false
    ansible_become_method: sudo
    ansible_become_password: ""

- name: "[SSH] Сброс старого SSH-соединения для проверки ключа"
  ansible.builtin.meta: reset_connection

- name: "[SSH] Проверка входа по ключу под deploy_user"
  ansible.builtin.command:
    cmd: id -un
  become: false
  register: deploy_user_ssh_check
  changed_when: false

- name: "[SSH] Подтверждение корректной SSH-аутентификации"
  ansible.builtin.assert:
    that:
      - deploy_user_ssh_check.stdout | trim == deploy_user
    fail_msg: >-
      Не удалось подтвердить SSH-вход как deploy_user. Проверьте, что приватный
      ключ доступен Ansible (ssh-agent/ansible.cfg/inventory), до отключения
      PasswordAuthentication. При необходимости задайте отдельные vps_ssh_password / vps_sudo_password
      или local_ssh_password / local_sudo_password в vars/secrets.yml.

- name: "[Privilege] Включение sudo после подтверждения SSH-аутентификации"
  ansible.builtin.set_fact:
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: ""

- name: "[SSH] Создание управляемого drop-in с настройками безопасности"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-00-servehub-hardening.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      PermitEmptyPasswords no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: "[SSH] Проверка итоговой конфигурации sshd"
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: "[SSH] Проверка эффективных параметров безопасности sshd"
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: sshd_effective_config
  changed_when: false
  failed_when: >-
    'pubkeyauthentication yes' not in sshd_effective_config.stdout or
    'passwordauthentication no' not in sshd_effective_config.stdout or
    'kbdinteractiveauthentication no' not in sshd_effective_config.stdout or
    'permitrootlogin no' not in sshd_effective_config.stdout or
    'maxauthtries 3' not in sshd_effective_config.stdout or
    'permitemptypasswords no' not in sshd_effective_config.stdout

- name: "[SSH] Применение настроек sshd до дальнейших шагов"
  ansible.builtin.meta: flush_handlers

- name: "[APT] Ubuntu 24.04: обновление списка пакетов и полный upgrade"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    dpkg_options: force-confdef,force-confold

- name: "[APT] Установка базовых пакетов и зависимостей"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - gnupg2
      - software-properties-common
      - python3-launchpadlib
      - git
      - build-essential
      - dkms
      - linux-headers-generic
      - borgbackup
      - rclone
      - pipx
      - python3-venv
      - gettext
      - argon2
      - openssl
      - fail2ban
      - python3-systemd
      - iptables
      - openssh-server
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: "[Fail2ban] Установка jail.local"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../configs/fail2ban/jail.local"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: fail2ban_config

- name: "[Fail2ban] Проверка конфигурации перед перезапуском"
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false

- name: "[Fail2ban] Включение и запуск службы"
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: "{{ 'restarted' if fail2ban_config.changed else 'started' }}"

- name: "[Fail2ban] Проверка наличия jail sshd"
  ansible.builtin.command:
    cmd: fail2ban-client status sshd
  changed_when: false

- name: "[Docker] Удаление конфликтующих пакетов из Ubuntu"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: true

- name: "[Docker] Создание /etc/apt/keyrings"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[Docker] Получение официального GPG-ключа"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: "[Docker] Определение архитектуры APT"
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: "[Docker] Подключение официального репозитория"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present
    update_cache: true

- name: "[Docker] Установка Docker Engine и Compose plugin"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "[Docker] Запуск демона и включение автозагрузки"
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: "[Docker] Проверка работоспособности Engine"
  ansible.builtin.command:
    cmd: docker info
  register: docker_info
  changed_when: false
  retries: 3
  delay: 5
  until: docker_info.rc == 0

- name: "[Docker] Добавление deploy_user в группу docker"
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups:
      - sudo
      - docker
    append: true
    state: present

- name: "[AmneziaWG] Скачивание GPG-ключа PPA"
  ansible.builtin.get_url:
    url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75C9DD72C799870E310542E24166F2C257290828
    dest: /etc/apt/keyrings/amnezia.asc
    owner: root
    group: root
    mode: "0644"

- name: "[AmneziaWG] Подключение PPA для Ubuntu 24.04"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/amnezia.asc] https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu noble main"
    filename: amnezia
    state: present
    update_cache: true

- name: "[AmneziaWG] Установка модулей и утилит"
  ansible.builtin.apt:
    name:
      - amneziawg
      - amneziawg-tools
    state: present
    update_cache: true

- name: "[AmneziaWG] Автозагрузка модуля ядра"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/amneziawg.conf
    content: "amneziawg\n"
    owner: root
    group: root
    mode: "0644"

- name: "[Net] Включение ip_nonlocal_bind"
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: "[Backup] Проверка установленной версии borgmatic"
  ansible.builtin.command:
    cmd: /usr/local/bin/borgmatic --version
  register: borgmatic_version_check
  failed_when: false
  changed_when: false

- name: "[Backup] Установка/обновление до фиксированной версии borgmatic"
  ansible.builtin.command:
    cmd: "pipx install --force borgmatic=={{ borgmatic_version | default('2.1.10') }}"
  when: >-
    borgmatic_version_check.rc != 0 or
    (borgmatic_version | default('2.1.10')) not in borgmatic_version_check.stdout
  environment:
    PIPX_HOME: /opt/pipx
    PIPX_BIN_DIR: /usr/local/bin

- name: "[Reboot] Проверка флага необходимости перезагрузки"
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: "[DKMS] Проверка сборки AmneziaWG для ядра, которое будет загружено"
  ansible.builtin.shell:
    cmd: |
      set -Eeuo pipefail

      if [[ -e /var/run/reboot-required ]]; then
        kernel_image=""
        for kernel_candidate in /vmlinuz /boot/vmlinuz; do
          if [[ ! -e "$kernel_candidate" && ! -L "$kernel_candidate" ]]; then
            continue
          fi

          resolved_kernel_image="$(readlink -e "$kernel_candidate" 2>/dev/null || true)"
          kernel_image_name="$(basename "$resolved_kernel_image")"
          if [[ "$kernel_image_name" == vmlinuz-* ]]; then
            kernel_image="$resolved_kernel_image"
            break
          fi
        done

        if [[ -z "$kernel_image" ]]; then
          shopt -s nullglob
          kernel_images=()
          for kernel_candidate in /boot/vmlinuz-*; do
            [[ -f "$kernel_candidate" ]] && kernel_images+=("$kernel_candidate")
          done
          if [[ -z "${kernel_images[*]-}" ]]; then
            echo "Cannot determine the target kernel: neither /vmlinuz nor /boot/vmlinuz-* contains a valid versioned kernel image." >&2
            exit 1
          fi

          kernel_image="$(printf '%s\n' "${kernel_images[@]}" | sort -V | tail -n 1)"
          printf 'Warning: no usable /vmlinuz symlink; using newest installed kernel image: %s\n' "$kernel_image" >&2
        fi

        kernel_image_name="$(basename "$kernel_image")"
        target_kernel="${kernel_image_name#vmlinuz-}"
      else
        target_kernel="$(uname -r)"
      fi

      headers_makefile="/lib/modules/${target_kernel}/build/Makefile"
      if [[ ! -f "$headers_makefile" ]]; then
        echo "Missing kernel headers for target kernel ${target_kernel}: ${headers_makefile}" >&2
        exit 1
      fi

      dkms autoinstall -k "$target_kernel"
      depmod -a "$target_kernel"
      modinfo -k "$target_kernel" amneziawg >/dev/null
      printf 'AmneziaWG module is built and discoverable for kernel %s.\n' "$target_kernel"
    executable: /bin/bash
  changed_when: false

- name: "[Reboot] Перезагрузка после обновления ОС/ядра"
  ansible.builtin.reboot:
    msg: "ServeHub-2: reboot after Ubuntu package/kernel update"
    connect_timeout: 10
    reboot_timeout: 900
    post_reboot_delay: 5
    test_command: id -un
  when: reboot_required.stat.exists

- name: "[DKMS] Сборка AmneziaWG для работающего ядра и загрузка модуля"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -lc
      - dkms autoinstall -k "$(uname -r)" && modprobe amneziawg
  changed_when: false

- name: "[AmneziaWG] Проверка загруженного модуля для текущего ядра"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -lc
      - modinfo -k "$(uname -r)" amneziawg >/dev/null && test -d /sys/module/amneziawg
  changed_when: false

- name: "[Postflight] Проверка запуска Docker после возможной перезагрузки"
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
