- name: "[Pause] Ручная миграция apps-data и сертификатов на VPS"
  ansible.builtin.pause:
    prompt: |
      ======================================================================
      МИГРАЦИЯ ДАННЫХ НА VPS (РУЧНОЙ ШАГ)
      ======================================================================
      Если это перенос с действующего сервера, скопируйте старую папку
      apps-data в /home/{{ deploy_user }}/ServeHub-2/apps-data/ и старую папку
      certbot в /home/{{ deploy_user }}/ServeHub-2/certbot/.
      На чистом сервере можно продолжить без копирования.

      SSH-подключение: ssh {{ deploy_user }}@{{ vps_public_ip }}
      После завершения переноса нажмите ENTER.

# Не удаляем wg0 вручную: интерфейс принадлежит работающему контейнеру wg-easy.
# Compose должен управлять его жизненным циклом, иначе повторный запуск Ansible
# может оставить контейнер запущенным без VPN-интерфейса.

# =========================================================================
# FILESYSTEM AND SERVICE DATA
# =========================================================================
- name: "[FS] Создание корневого каталога apps-data на VPS"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: "[FS] Создание каталогов wg-easy и AdGuard Home с ограниченными правами"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - wg-easy
    - adguard/work

- name: "[FS] Создание каталогов Certbot"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - certbot/certs
    - certbot/certs-data
    - certbot/www

# =========================================================================
# CERTBOT + WEBNAMES DNS-01
# =========================================================================
- name: "[Certbot] Клонирование Webnames DNS hook scripts"
  ansible.builtin.git:
    repo: https://github.com/regtime-ltd/certbot-dns-webnames.git
    dest: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames"
    version: master
    update: false
  become_user: "{{ deploy_user }}"

- name: "[Certbot] Получение секретной конфигурации Webnames API"
  ansible.builtin.get_url:
    url: "https://www.webnames.ru/scripts/json_domain_zone_manager.pl?action=get_config_certbot&domain={{ server_name | urlencode }}&apikey={{ webnames_apikey | urlencode }}"
    dest: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"
  no_log: true

- name: "[Certbot] Проверка файла конфигурации Webnames"
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  register: webnames_config_stat

- name: "[Certbot] Проверка, что конфигурация Webnames существует и непуста"
  ansible.builtin.assert:
    that:
      - webnames_config_stat.stat.exists
      - webnames_config_stat.stat.size | default(0) | int > 0
    fail_msg: "Webnames API вернул пустой или отсутствующий config.sh. Проверьте домен и API-ключ."

- name: "[Certbot] Проверка синтаксиса config.sh без вывода секретов"
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -n
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  changed_when: false
  no_log: true

- name: "[Certbot] Проверка наличия API_KEY в конфигурации Webnames"
  ansible.builtin.command:
    argv:
      - /bin/grep
      - -Eq
      - '^[[:space:]]*(export[[:space:]]+)?API_KEY='
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/config.sh"
  changed_when: false
  no_log: true

- name: "[Certbot] Выдача execute-bit только hook-скриптам"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certbot-dns-webnames/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - authenticator.sh
    - cleanup.sh

- name: "[Certbot] Сборка образа до первого выпуска/обновления сертификата"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml build certbot
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false

- name: "[Docker Compose] Проверка конфигурации remote-стека до выпуска сертификата"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml config --quiet
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false
  no_log: true

- name: "[Certbot] Проверка наличия текущего сертификата"
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/ServeHub-2/certbot/certs/live/{{ server_name }}/fullchain.pem"
  register: current_cert_stat

- name: "[Certbot] Проверка срока действия сертификата (30 дней)"
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "2592000"
      - -noout
      - -in
      - "/home/{{ deploy_user }}/ServeHub-2/certbot/certs/live/{{ server_name }}/fullchain.pem"
  register: cert_expiry_check
  when: current_cert_stat.stat.exists
  failed_when: false
  changed_when: false

- name: "[Certbot] Первый выпуск сертификата через DNS-01"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml run --rm certbot
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: not current_cert_stat.stat.exists
  register: certbot_initial_issue

- name: "[Certbot] Обновление сертификата, если он истекает в течение 30 дней"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml run --rm certbot renew --non-interactive
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when:
    - current_cert_stat.stat.exists
    - cert_expiry_check.rc is defined
    - cert_expiry_check.rc != 0
  register: certbot_renewal

# =========================================================================
# AUTOMATIC CERTIFICATE RENEWAL
# =========================================================================
- name: "[Systemd] Установка сервиса certbot-renew.service"
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Renew ServeHub-2 TLS certificates using Webnames DNS-01
      Wants=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      User=root
      WorkingDirectory=/home/{{ deploy_user }}/ServeHub-2
      ExecStart=/bin/bash /home/{{ deploy_user }}/ServeHub-2/scripts/renew_certs.sh
      TimeoutStartSec=30min
  register: certbot_service_file

- name: "[Systemd] Установка таймера certbot-renew.timer"
  ansible.builtin.copy:
    dest: /etc/systemd/system/certbot-renew.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Twice-daily ServeHub-2 TLS certificate renewal check

      [Timer]
      OnCalendar=*-*-* 03,15:00:00
      RandomizedDelaySec=900
      Persistent=true

      [Install]
      WantedBy=timers.target
  register: certbot_timer_file

- name: "[Systemd] Перечитывание unit-файлов при изменениях"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: certbot_service_file.changed or certbot_timer_file.changed

- name: "[Systemd] Включение таймера Certbot"
  ansible.builtin.systemd_service:
    name: certbot-renew.timer
    enabled: true
    state: started

# =========================================================================
# KERNEL / IP FORWARDING / FIREWALL
# =========================================================================
- name: "[Kernel] Загрузка модуля AmneziaWG"
  ansible.builtin.command:
    cmd: modprobe amneziawg
  changed_when: false

- name: "[Kernel] Настройка параметров маршрутизации"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv4.conf.all.src_valid_mark", value: "1" }

- name: "[Firewall] Удаление iptables-persistent, не сохраняем динамические цепочки Docker"
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: false

- name: "[Firewall] Создание скрипта правил ServeHub и изоляции панели wg-easy"
  ansible.builtin.copy:
    dest: /usr/local/sbin/servehub-firewall-vps.sh
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      IPT=/usr/sbin/iptables
      IP6T=/usr/sbin/ip6tables
      OUT_IFACE={{ ansible_facts['default_ipv4']['interface'] | quote }}

      # VPN forwarding and NAT.
      $IPT -C FORWARD -i wg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -i wg0 -j ACCEPT
      $IPT -C FORWARD -o wg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -o wg0 -j ACCEPT
      $IPT -t nat -C POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE 2>/dev/null || \
        $IPT -t nat -A POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE

      # Put a single jump at the start of INPUT so unrelated rules cannot expose wg-easy UI.
      $IPT -N SERVEHUB_WGEASY 2>/dev/null || true
      $IPT -F SERVEHUB_WGEASY
      $IPT -A SERVEHUB_WGEASY -s 127.0.0.1/32 -j ACCEPT
      $IPT -A SERVEHUB_WGEASY -s 10.8.0.0/24 -j ACCEPT
      $IPT -A SERVEHUB_WGEASY -j DROP
      while $IPT -C INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY 2>/dev/null; do
        $IPT -D INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY
      done
      $IPT -I INPUT 1 -p tcp --dport 51821 -j SERVEHUB_WGEASY

      # wg-easy has IPv6 disabled, so only permit local IPv6 loopback to the UI.
      if command -v "$IP6T" >/dev/null 2>&1; then
        $IP6T -N SERVEHUB_WGEASY_V6 2>/dev/null || true
        $IP6T -F SERVEHUB_WGEASY_V6
        $IP6T -A SERVEHUB_WGEASY_V6 -s ::1/128 -j ACCEPT
        $IP6T -A SERVEHUB_WGEASY_V6 -j DROP
        while $IP6T -C INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY_V6 2>/dev/null; do
          $IP6T -D INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY_V6
        done
        $IP6T -I INPUT 1 -p tcp --dport 51821 -j SERVEHUB_WGEASY_V6
      fi
  register: vps_firewall_script

- name: "[Firewall] Создание systemd-сервиса восстановления правил ServeHub"
  ansible.builtin.copy:
    dest: /etc/systemd/system/servehub-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Restore ServeHub VPN firewall and restrict wg-easy UI
      Wants=network-online.target
      After=network-online.target docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/servehub-firewall-vps.sh

      [Install]
      WantedBy=multi-user.target
  register: vps_firewall_unit

- name: "[Firewall] Перечитывание systemd при изменении unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: vps_firewall_unit.changed

- name: "[Firewall] Применение правил и включение автозагрузки"
  ansible.builtin.systemd_service:
    name: servehub-firewall.service
    enabled: true
    state: "{{ 'restarted' if vps_firewall_script.changed or vps_firewall_unit.changed else 'started' }}"

# =========================================================================
# ADGUARD HOME CONFIGURATION
# =========================================================================
- name: "[AdGuard] Создание каталога конфигурации"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/configs/adguard/conf"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: "[AdGuard] Генерация AdGuardHome.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/AdGuardHome.yaml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/configs/adguard/conf/AdGuardHome.yaml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  register: adguard_config
  no_log: true

# =========================================================================
# START / VALIDATE THE VPS STACK
# =========================================================================
- name: "[Docker] Запуск стека ServeHub-2 на VPS без безусловного restart Docker"
  community.docker.docker_compose_v2:
    project_src: "/home/{{ deploy_user }}/ServeHub-2"
    files:
      - docker-compose.remote.yaml
    state: present
    pull: missing
    # The certbot Compose service has --force-renewal as its default command.
    # Keep it out of normal stack startup; the tasks above and timer invoke it explicitly.
    services:
      - nginx
      - wg-easy
      - gatus
      - nginx-exporter
      - adguardhome
      - adguard-exporter
      - homepage
      - node-exporter
      - cadvisor
      - portainer-agent
      - alloy
  register: compose_start

- name: "[AdGuard] Применение изменённой конфигурации"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml restart adguardhome
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: adguard_config.changed

- name: "[Certbot] Перезапуск Nginx после обновления существующего сертификата"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml restart nginx
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when:
    - current_cert_stat.stat.exists
    - cert_expiry_check.rc is defined
    - cert_expiry_check.rc != 0

- name: "[Docker Compose] Проверка статуса контейнеров VPS"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml ps
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  register: docker_ps_status
  changed_when: false

- name: "[Status] Текущий статус контейнеров VPS"
  ansible.builtin.debug:
    var: docker_ps_status.stdout_lines
