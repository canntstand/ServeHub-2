


- name: "[Hermes] Проверка обязательной конфигурации API и Dashboard"
  ansible.builtin.assert:
    that:
      - hermes_api_base_url is defined and (hermes_api_base_url | string | trim | length) > 0
      - hermes_api_base_url is match('^https?://\\S+$')
      - hermes_api_key is defined and (hermes_api_key | string | trim | length) > 0
      - hermes_model is defined and (hermes_model | string | trim | length) > 0
      - hermes_dashboard_basic_auth_secret is defined and (hermes_dashboard_basic_auth_secret | string | trim) is match('^[A-Fa-f0-9]{64}$')
    fail_msg: >-
      Hermes is a required Edge service. Set hermes_api_base_url, hermes_api_key, hermes_model,
      and a 64-character hexadecimal hermes_dashboard_basic_auth_secret in ansible/vars/secrets.yml.
  no_log: true

- name: "[Hermes] Создание каталога постоянных данных"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/hermes"
    state: directory
    owner: "10000"
    group: "10000"
    mode: "0700"

- name: "[Hermes] Начальная конфигурация модели и доверенного reverse proxy"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes_config.yaml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/apps-data/hermes/config.yaml"
    owner: "10000"
    group: "10000"
    mode: "0600"
    force: false
  no_log: true

- name: "[Hermes] Начальные API credentials (не перезаписывать настройки Dashboard)"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes_env.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/apps-data/hermes/.env"
    owner: "10000"
    group: "10000"
    mode: "0600"
    force: false
  no_log: true

- name: "[FS] Создание корневого каталога apps-data на VPS"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: "[FS] Создание каталогов wg-easy и AdGuard Home с ограниченными правами"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - wg-easy
    - adguard/work

- name: "[FS] Создание каталогов мониторинга на Edge с владельцами контейнеров"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "loki", owner: "10001", group: "10001", mode: "0700" }
    - { path: "alertmanager", owner: "65534", group: "65534", mode: "0700" }
    - { path: "prometheus", owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0755" }
    - { path: "prometheus/data", owner: "65534", group: "65534", mode: "0700" }
    - { path: "grafana/data", owner: "472", group: "472", mode: "0700" }
    - { path: "alloy", owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0750" }

- name: "[Backup] Каталог метрик Borgmatic для Node Exporter на Edge"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/apps-data/node-exporter/textfile"
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "[Kernel] Загрузка модуля AmneziaWG"
  ansible.builtin.command:
    cmd: modprobe amneziawg
  changed_when: false

- name: "[Kernel] Настройка параметров маршрутизации"
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.ipv4.conf.all.src_valid_mark", value: "1" }

- name: "[Firewall] Удаление iptables-persistent, не сохраняем динамические цепочки Docker"
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: false

- name: "[Firewall] Политика default-deny для VPS и Docker-публикаций"
  ansible.builtin.copy:
    dest: /usr/local/sbin/servehub-firewall-vps.sh
    owner: root
    group: root
    mode: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      IPT=/usr/sbin/iptables
      IP6T=/usr/sbin/ip6tables
      OUT_IFACE={{ ansible_facts['default_ipv4']['interface'] | quote }}

      # Preserve WireGuard forwarding and outbound NAT.
      $IPT -C FORWARD -i wg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -i wg0 -j ACCEPT
      $IPT -C FORWARD -o wg0 -j ACCEPT 2>/dev/null || $IPT -A FORWARD -o wg0 -j ACCEPT
      $IPT -t nat -C POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE 2>/dev/null || \
        $IPT -t nat -A POSTROUTING -s 10.8.0.0/24 -o "$OUT_IFACE" -j MASQUERADE

      # Host INPUT: public SSH and WireGuard only; admin/metrics are VPN-only.
      $IPT -N SERVEHUB_INPUT 2>/dev/null || true
      $IPT -F SERVEHUB_INPUT
      $IPT -A SERVEHUB_INPUT -i lo -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i wg0 -s 10.8.0.2 -p tcp -m multiport --dports 8082,8090,9090,9100,51821 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i wg0 -s 10.8.0.0/24 -p tcp -m multiport --dports 8082,8090,9090,9100,51821 -j DROP
      $IPT -A SERVEHUB_INPUT -i br+ -s 172.16.0.0/12 -d 10.8.0.1 -p tcp --dport 8082 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
      $IPT -A SERVEHUB_INPUT -p icmp -j ACCEPT
      # Keep Fail2ban effective even though this chain is inserted before other INPUT rules.
      if $IPT -nL f2b-sshd >/dev/null 2>&1; then
        $IPT -A SERVEHUB_INPUT -p tcp --dport 22 -j f2b-sshd
      fi
      $IPT -A SERVEHUB_INPUT -p tcp --dport 22 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -p udp --dport 51820 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i wg0 -s 10.8.0.0/24 -p tcp --dport 53 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -i wg0 -s 10.8.0.0/24 -p udp --dport 53 -j ACCEPT
      $IPT -A SERVEHUB_INPUT -j DROP
      while $IPT -C INPUT -j SERVEHUB_INPUT 2>/dev/null; do
        $IPT -D INPUT -j SERVEHUB_INPUT
      done
      $IPT -I INPUT 1 -j SERVEHUB_INPUT

      # Remove obsolete one-port policy (it is now covered by SERVEHUB_INPUT).
      while $IPT -C INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY 2>/dev/null; do
        $IPT -D INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY
      done
      $IPT -F SERVEHUB_WGEASY 2>/dev/null || true
      $IPT -X SERVEHUB_WGEASY 2>/dev/null || true

      if command -v "$IP6T" >/dev/null 2>&1; then
        $IP6T -N SERVEHUB_INPUT_V6 2>/dev/null || true
        $IP6T -F SERVEHUB_INPUT_V6
        $IP6T -A SERVEHUB_INPUT_V6 -i lo -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -p ipv6-icmp -j ACCEPT
        if $IP6T -nL f2b-sshd >/dev/null 2>&1; then
          $IP6T -A SERVEHUB_INPUT_V6 -p tcp --dport 22 -j f2b-sshd
        fi
        $IP6T -A SERVEHUB_INPUT_V6 -p tcp --dport 22 -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -p udp --dport 51820 -j ACCEPT
        $IP6T -A SERVEHUB_INPUT_V6 -j DROP
        while $IP6T -C INPUT -j SERVEHUB_INPUT_V6 2>/dev/null; do
          $IP6T -D INPUT -j SERVEHUB_INPUT_V6
        done
        $IP6T -I INPUT 1 -j SERVEHUB_INPUT_V6

        while $IP6T -C INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY_V6 2>/dev/null; do
          $IP6T -D INPUT -p tcp --dport 51821 -j SERVEHUB_WGEASY_V6
        done
        $IP6T -F SERVEHUB_WGEASY_V6 2>/dev/null || true
        $IP6T -X SERVEHUB_WGEASY_V6 2>/dev/null || true
      fi

      # Published Docker ports bypass INPUT through DNAT; constrain them in DOCKER-USER.
      for attempt in {1..30}; do
        $IPT -nL DOCKER-USER >/dev/null 2>&1 && break
        sleep 1
      done
      if ! $IPT -nL DOCKER-USER >/dev/null 2>&1; then
        echo "Docker's DOCKER-USER chain is missing; refusing to apply an incomplete firewall." >&2
        exit 1
      fi
      $IPT -N SERVEHUB_DOCKER_USER 2>/dev/null || true
      $IPT -F SERVEHUB_DOCKER_USER
      for port in 3000 3100 9093 9119; do
        $IPT -A SERVEHUB_DOCKER_USER -i wg0 -s 10.8.0.2 -p tcp -m conntrack --ctorigdst 10.8.0.1 --ctorigdstport "$port" -j RETURN
        $IPT -A SERVEHUB_DOCKER_USER -i wg0 -p tcp -m conntrack --ctorigdst 10.8.0.1 --ctorigdstport "$port" -j DROP
      done
      $IPT -A SERVEHUB_DOCKER_USER -i wg0 -p tcp -m conntrack --ctorigdst 10.8.0.1 --ctorigdstport 9618 -j DROP
      $IPT -A SERVEHUB_DOCKER_USER -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
      $IPT -A SERVEHUB_DOCKER_USER -i "$OUT_IFACE" -m conntrack --ctstate NEW -j DROP
      $IPT -A SERVEHUB_DOCKER_USER -j RETURN
      while $IPT -C DOCKER-USER -j SERVEHUB_DOCKER_USER 2>/dev/null; do
        $IPT -D DOCKER-USER -j SERVEHUB_DOCKER_USER
      done
      $IPT -I DOCKER-USER 1 -j SERVEHUB_DOCKER_USER

      if command -v "$IP6T" >/dev/null 2>&1 && $IP6T -nL DOCKER-USER >/dev/null 2>&1; then
        $IP6T -N SERVEHUB_DOCKER_USER_V6 2>/dev/null || true
        $IP6T -F SERVEHUB_DOCKER_USER_V6
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -i "$OUT_IFACE" -m conntrack --ctstate NEW -j DROP
        $IP6T -A SERVEHUB_DOCKER_USER_V6 -j RETURN
        while $IP6T -C DOCKER-USER -j SERVEHUB_DOCKER_USER_V6 2>/dev/null; do
          $IP6T -D DOCKER-USER -j SERVEHUB_DOCKER_USER_V6
        done
        $IP6T -I DOCKER-USER 1 -j SERVEHUB_DOCKER_USER_V6
      fi
  register: vps_firewall_script

- name: "[Firewall] Создание systemd-сервиса восстановления правил ServeHub"
  ansible.builtin.copy:
    dest: /etc/systemd/system/servehub-firewall.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Restore ServeHub VPN firewall and restrict wg-easy UI
      Wants=network-online.target
      After=network-online.target docker.service
      PartOf=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/servehub-firewall-vps.sh

      [Install]
      WantedBy=multi-user.target
  register: vps_firewall_unit

- name: "[Firewall] Перечитывание systemd при изменении unit"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: vps_firewall_unit.changed

- name: "[Firewall] Применение правил и включение автозагрузки"
  ansible.builtin.systemd_service:
    name: servehub-firewall.service
    enabled: true
    state: "{{ 'restarted' if vps_firewall_script.changed or vps_firewall_unit.changed else 'started' }}"

- name: "[AdGuard] Создание каталога конфигурации"
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/ServeHub-2/configs/adguard/conf"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: "[AdGuard] Генерация AdGuardHome.yaml"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/AdGuardHome.yaml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/configs/adguard/conf/AdGuardHome.yaml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  register: adguard_config
  no_log: true

- name: "[Prometheus] Генерация конфигурации с целями Blackbox Exporter"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/prometheus.yml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/configs/monitoring/prometheus.generated.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  register: prometheus_config

- name: "[Alertmanager] Генерация конфигурации на Edge"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/alertmanager.yml.j2"
    dest: "/home/{{ deploy_user }}/ServeHub-2/configs/monitoring/alertmanager.yml"
    owner: "{{ deploy_user }}"
    group: "65534"
    mode: "0640"
  register: alertmanager_config
  no_log: true

- name: "[Docker Compose] Проверка конфигурации Edge"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml config --quiet
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: false
  no_log: true

- name: "[Docker] Запуск стека Edge без устаревших контейнеров"
  community.docker.docker_compose_v2:
    project_src: "/home/{{ deploy_user }}/ServeHub-2"
    files:
      - docker-compose.remote.yaml
    state: present
    pull: missing
    remove_orphans: true
  register: compose_start

- name: "[Alertmanager] Применение изменённой конфигурации на Edge"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml restart alertmanager
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: alertmanager_config.changed

- name: "[Prometheus] Перезагрузка scrape-конфигурации и alert rules"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml restart prometheus
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  changed_when: true

- name: "[AdGuard] Применение изменённой конфигурации"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml restart adguardhome
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  when: adguard_config.changed

- name: "[Docker Compose] Проверка статуса контейнеров VPS"
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.remote.yaml ps
    chdir: "/home/{{ deploy_user }}/ServeHub-2"
  register: docker_ps_status
  changed_when: false

- name: "[Status] Текущий статус контейнеров VPS"
  ansible.builtin.debug:
    var: docker_ps_status.stdout_lines

- name: "[Backup] Настройка Borgmatic и off-site S3 для Edge"
  ansible.builtin.include_tasks: setup_backup.yml
  vars:
    backup_role: edge
    backup_repository_path: /var/lib/servehub-backup/edge-repo
    backup_metrics_dir: "/home/{{ deploy_user }}/ServeHub-2/apps-data/node-exporter/textfile"
    backup_compose_file: docker-compose.remote.yaml
    backup_keep_services: "node-exporter cadvisor"
    backup_schedule_time: "03:00:00"
