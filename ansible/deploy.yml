- name: "[Bootstrap] Подготовка доступа и базовая настройка Ubuntu 24.04"
  hosts: vps,local
  gather_facts: false
  vars_files:
    - vars/secrets.yml
  tags: bootstrap
  vars:
    ansible_python_interpreter: /usr/bin/python3

  pre_tasks:
    - name: "[SSH] Проверка прямого root-доступа без зависимости от Python"
      ansible.builtin.raw: id -u
      vars:
        ansible_user: root
        ansible_password: "{{ root_ssh_password }}"
        ansible_become: false
      register: root_auth_check
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: "[SSH] Использование root, если прямой вход доступен"
      ansible.builtin.set_fact:
        ansible_user: root
        ansible_password: "{{ root_ssh_password }}"
        ansible_become: false
      when:
        - root_auth_check.rc | default(-1) == 0
        - root_auth_check.stdout | default('') | trim == '0'

    - name: "[SSH] Использование sudo для исходного пользователя"
      ansible.builtin.set_fact:
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_password: "{{ bootstrap_sudo_password }}"
      when: >-
        (root_auth_check.rc | default(-1) != 0)
        or (root_auth_check.stdout | default('') | trim != '0')

  tasks:
    - name: "[Bootstrap] Проверка ОС и установка Python3/python3-apt при необходимости"
      ansible.builtin.raw: |
        set -eu
        . /etc/os-release
        if [ "${ID:-}" != "ubuntu" ] || [ "${VERSION_ID:-}" != "24.04" ]; then
          echo "Unsupported OS: ${PRETTY_NAME:-unknown}. Required Ubuntu 24.04 LTS." >&2
          exit 1
        fi
        if [ ! -x /usr/bin/python3 ] || ! /usr/bin/python3 -c 'import apt' >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
          echo PYTHON_BOOTSTRAP_PACKAGES_INSTALLED
        else
          echo PYTHON_BOOTSTRAP_PACKAGES_ALREADY_PRESENT
        fi
      register: python3_bootstrap
      changed_when: "'PYTHON_BOOTSTRAP_PACKAGES_INSTALLED' in python3_bootstrap.stdout"

    - name: "[Facts] Сбор системных фактов после установки Python"
      ansible.builtin.setup:

    - name: "[Preflight] Проверка Ubuntu 24.04 LTS"
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: "Поддерживается только Ubuntu 24.04 LTS."

    - name: "[Bootstrap] Запуск сценария базовой настройки ОС"
      ansible.builtin.include_tasks: tasks/bootstrap_os.yml

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

- name: "[Git] Синхронизация репозитория ServeHub-2"
  hosts: vps,local
  gather_facts: true
  vars_files:
    - vars/secrets.yml
  become: true
  tasks:
    - name: "[Preflight] Проверка доступности пользователя развёртывания"
      ansible.builtin.assert:
        that:
          - deploy_user is defined
          - deploy_user | length > 0
          - ansible_user == deploy_user
        fail_msg: >-
          После bootstrap Ansible должен подключаться как deploy_user по SSH-ключу.
          Проверьте ansible_user, ssh_public_key и ansible.cfg/inventory.

    - name: "[Git] Клонирование или безопасное обновление репозитория ServeHub-2"
      ansible.builtin.git:
        repo: "https://github.com/canntstand/ServeHub-2.git"
        dest: "/home/{{ deploy_user }}/ServeHub-2"
        version: dev
        clone: true
        update: true
        force: false
      become_user: "{{ deploy_user }}"

    - name: "[Общее] Генерация файла .env из шаблона env.j2"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/env.j2"
        dest: "/home/{{ deploy_user }}/ServeHub-2/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"
      no_log: true

- name: "Настройка удалённой инфраструктуры (VPS)"
  hosts: vps
  gather_facts: true
  vars_files:
    - vars/secrets.yml
  become: true
  tasks:
    - name: "[VPS] Запуск задач настройки удалённого сервера"
      ansible.builtin.include_tasks: tasks/setup_remote.yml

- name: "Настройка локальной инфраструктуры (Local Server)"
  hosts: local
  gather_facts: true
  vars_files:
    - vars/secrets.yml
  become: true
  tasks:
    - name: "[Local] Запуск задач настройки локального сервера"
      ansible.builtin.include_tasks: tasks/setup_local.yml

- name: "Проверка восстановления AmneziaWG и связности VPN"
  hosts: vps,local
  gather_facts: false
  become: true
  tasks:
    - name: "[VPN postflight] Ожидание healthy-контейнера wg-easy на Edge"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{' }}.State.Health.Status{{ '}}' }}"
          - wg-easy
      register: edge_vpn_health
      changed_when: false
      retries: 18
      delay: 5
      until: edge_vpn_health.stdout | trim == 'healthy'
      when: inventory_hostname in groups['vps']

    - name: "[VPN postflight] Ожидание healthy-контейнера amnezia-client на Workload"
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - "--format={{ '{{' }}.State.Health.Status{{ '}}' }}"
          - amnezia-client
      register: workload_vpn_health
      changed_when: false
      retries: 18
      delay: 5
      until: workload_vpn_health.stdout | trim == 'healthy'
      when: inventory_hostname in groups['local']

    - name: "[VPN postflight] Проверка связи Edge → Workload"
      ansible.builtin.uri:
        url: "http://10.8.0.2:8080/health-check"
        method: GET
        status_code: 200
        timeout: 5
        use_proxy: false
      register: edge_to_workload_check
      retries: 18
      delay: 5
      until: edge_to_workload_check.status | default(0) == 200
      when: inventory_hostname in groups['vps']

    - name: "[VPN postflight] Проверка связи Workload → Edge"
      ansible.builtin.uri:
        url: "http://10.8.0.1:9100/metrics"
        method: GET
        status_code: 200
        timeout: 5
        use_proxy: false
      register: workload_to_edge_check
      retries: 18
      delay: 5
      until: workload_to_edge_check.status | default(0) == 200
      when: inventory_hostname in groups['local']
